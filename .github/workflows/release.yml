name: release
run-name: "release ${{ inputs.version || (github.ref_type == 'tag' && github.ref_name) || format('auto from {0}', github.ref_name) }}"

# Builds the CLI for every target and the desktop app for macOS arm64, and publishes them to a GitHub release.
# Trigger it by dispatching (the version is optional), or by pushing a v<version> tag.
# A dispatch without a version releases <packages/cli version>-fork.<run number>, for example 2.2.7-fork.12.
# Nothing is notarized, and nothing is published to npm, Docker or package managers.
# The CLI binaries are unsigned; the macOS desktop app is signed ad hoc only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v. Leave empty for <cli version>-fork.<run number>"
        required: false
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        type: boolean
        default: false

concurrency:
  # Runs for the same version queue; automatic versions are unique per run.
  group: ${{ github.workflow }}-${{ inputs.version || (github.ref_type == 'tag' && github.ref_name) || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Resolves the version once for every job: the dispatched input, the pushed tag, or <cli version>-fork.<run number>.
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          sparse-checkout: packages/cli/package.json
          sparse-checkout-cone-mode: false

      - name: Resolve
        id: resolve
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(jq -r .version packages/cli/package.json)-fork.$GITHUB_RUN_NUMBER"
          fi
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Not a semver version: $version"
            exit 1
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v$version already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing \`v$version\` from \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}

  build:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENCODE_VERSION: ${{ needs.version.outputs.version }}
      OPENCODE_CHANNEL: latest
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.4

      - name: Fetch models catalog
        run: bun packages/core/script/update-models-snapshot.ts .cache/models-catalog/api.json

      - name: Build
        working-directory: packages/cli
        run: bun run build && rm -rf dist/.bun
        env:
          BUN_COMPILE_RELEASE: bun-v1.4.4
          OPENCODE_MODELS_SNAPSHOT: ${{ github.workspace }}/.cache/models-catalog/api.json
          GH_TOKEN: ${{ github.token }} # read-only; raises the rate limit for Bun release downloads

      - name: Verify bundled models catalog
        run: bun packages/cli/script/catalog-smoke.ts packages/cli/dist/cli-linux-x64/bin/opencode
        env:
          OPENCODE_MODELS_SNAPSHOT: ${{ github.workspace }}/.cache/models-catalog/api.json

      - name: Archive
        run: |
          mkdir -p out
          for dir in packages/cli/dist/*/; do
            name=$(basename "$dir")
            [ -d "$dir/bin" ] || continue
            if [ -f "$dir/bin/opencode.exe" ]; then
              (cd "$dir/bin" && zip -q "$GITHUB_WORKSPACE/out/$name.zip" opencode.exe)
            else
              tar -czf "out/$name.tar.gz" -C "$dir/bin" opencode
            fi
          done
          (cd out && sha256sum * > SHA256SUMS)
          ls -l out

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-archives
          path: out
          if-no-files-found: error

  # Desktop app for macOS arm64 only. It bundles the CLI for its own target, so the CLI is built here for that target.
  desktop-mac-arm64:
    needs: version
    runs-on: macos-26
    timeout-minutes: 60
    env:
      OPENCODE_VERSION: ${{ needs.version.outputs.version }}
      OPENCODE_CHANNEL: latest
      OPENCODE_TARGET: darwin-arm64
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.4
          install-flags: --os=darwin --cpu=arm64

      - name: Fetch models catalog
        run: bun packages/core/script/update-models-snapshot.ts .cache/models-catalog/api.json

      - name: Build CLI
        working-directory: packages/cli
        run: bun run build && rm -rf dist/.bun
        env:
          BUN_COMPILE_RELEASE: bun-v1.4.4
          OPENCODE_MODELS_SNAPSHOT: ${{ github.workspace }}/.cache/models-catalog/api.json
          GH_TOKEN: ${{ github.token }}

      - name: Build desktop
        working-directory: packages/desktop
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Pack desktop
        working-directory: packages/desktop
        timeout-minutes: 40
        run: bun run pack

      # pack.ts leaves the .app unsigned. Apple silicon refuses to run unsigned code, so sign it ad hoc.
      # The app is not notarized: on first launch, run `xattr -cr OpenCode.app` or allow it in System Settings.
      - name: Sign ad hoc and zip
        run: |
          mkdir -p out app
          tar -xf dist/desktop/opencode-desktop-mac-arm64.app.tar -C app
          codesign --force --deep --sign - app/*.app
          ditto -c -k --keepParent app/*.app out/opencode-desktop-mac-arm64.zip

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-desktop
          path: out
          if-no-files-found: error

  publish:
    needs: [version, build, desktop-mac-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: out
          merge-multiple: true

      - name: Checksums
        run: cd out && rm -f SHA256SUMS && sha256sum * > SHA256SUMS

      - name: Publish
        run: |
          tag="v$VERSION"
          flags=(--repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes)
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then flags+=(--target "$GITHUB_SHA"); fi
          gh release create "$tag" out/* "${flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
